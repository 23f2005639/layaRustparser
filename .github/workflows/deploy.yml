name: Deploy to EC2

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.pdf'
      - '**.svg'
      - 'docs/**'
      - 'presentation_assets/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: false
        default: 'production'

concurrency:
  group: deploy-ec2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate GitHub Secrets Configuration
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "::error::EC2_HOST secret is not configured in repository settings."
            exit 1
          fi
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "::error::EC2_SSH_KEY secret is not configured in repository settings."
            exit 1
          fi
          echo "GitHub Secrets EC2_HOST and EC2_SSH_KEY are present."

      - name: Configure SSH Key & Host Authentication
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Write SSH private key
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Ensure trailing newline on private key if stripped
          sed -i -e '$a\' ~/.ssh/id_rsa
          
          # Scan and store host key for known_hosts
          SSH_PORT="${{ secrets.EC2_PORT || '22' }}"
          ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Trigger Remote Deployment on EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT || '22' }}
          APP_DIR: ${{ secrets.APP_DIR || '/home/ubuntu/layaRustparser' }}
        run: |
          echo "Connecting to $EC2_USER@$EC2_HOST:$EC2_PORT..."
          ssh -o ConnectTimeout=15 -p "$EC2_PORT" "$EC2_USER@$EC2_HOST" \
            "APP_DIR='$APP_DIR' bash -s" << 'REMOTE_SCRIPT'
            set -euo pipefail
            
            echo "=========================================="
            echo "  ULPF CI/CD Remote Deploy Agent"
            echo "=========================================="
            
            # Setup environment
            source "$HOME/.cargo/env" 2>/dev/null || true
            export PATH="$HOME/.cargo/bin:$PATH"
            
            TARGET_DIR="${APP_DIR:-$HOME/layaRustparser}"
            if [ ! -d "$TARGET_DIR" ]; then
              echo "Target directory $TARGET_DIR not found, attempting clone..."
              git clone https://github.com/guptchar/layaRustparser.git "$TARGET_DIR"
            fi
            
            cd "$TARGET_DIR"
            echo "==> Working directory: $(pwd)"
            
            # Synchronize with upstream remote
            echo "==> Fetching latest changes..."
            git fetch --all --prune
            
            CURRENT_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
            if [ "$CURRENT_BRANCH" = "HEAD" ]; then
              git checkout master || git checkout main
            fi
            
            git reset --hard origin/"$(git rev-parse --abbrev-ref HEAD)"
            
            # Execute on-server deployment
            chmod +x scripts/deploy_ec2.sh
            ./scripts/deploy_ec2.sh
          REMOTE_SCRIPT
